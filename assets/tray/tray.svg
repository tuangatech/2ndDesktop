<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>2ndDesktop tray icon, Windows (a white 2 on a coral tile; used on Windows and macOS, reads on a light and a dark bar)</title>
