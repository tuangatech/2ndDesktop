  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#t)"/>
  <g transform="translate(16 16) scale(0.029) translate(-520 -506)"><path d="M340 396C340 294 420 232 516 232C618 232 690 296 690 388C690 462 648 514 588 566L338 780L702 780" fill="none" stroke="#ffffff" stroke-width="138" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
