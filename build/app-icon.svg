<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>2ndDesktop app icon (a window with a tree outside)</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34487f"/>
      <stop offset="1" stop-color="#18254a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="0.65" stop-color="#fcd9a8"/>
      <stop offset="1" stop-color="#f7b79b"/>
    </linearGradient>
    <clipPath id="glass"><rect x="268" y="212" width="488" height="568" rx="22"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#wall)"/>
  <!-- window frame -->
  <rect x="232" y="176" width="560" height="640" rx="52" fill="#f4efe6"/>
  <!-- the view -->
  <g clip-path="url(#glass)">
    <rect x="268" y="212" width="488" height="568" fill="url(#sky)"/>
    <circle cx="372" cy="330" r="46" fill="#fff4c9"/>
    <path d="M268 672C380 612 470 650 580 664S720 640 756 628V780H268Z" fill="#86c7a0"/>
    <rect x="584" y="500" width="34" height="250" rx="12" fill="#8a6a4b"/>
    <g fill="#4d9c7a">
      <circle cx="600" cy="420" r="124"/>
      <circle cx="530" cy="478" r="98"/>
      <circle cx="672" cy="482" r="98"/>
    </g>
    <g fill="#7cc496" fill-opacity="0.7">
      <circle cx="570" cy="380" r="60"/>
      <circle cx="660" cy="440" r="44"/>
    </g>
    <path d="M268 724C400 676 520 740 756 700V780H268Z" fill="#4d9c7a"/>
    <!-- window bars -->
    <rect x="500" y="212" width="24" height="568" fill="#f4efe6"/>
    <rect x="268" y="452" width="488" height="24" fill="#f4efe6"/>
  </g>
  <!-- sill -->
  <rect x="200" y="808" width="624" height="52" rx="26" fill="#d8cdbb"/>
</svg>
