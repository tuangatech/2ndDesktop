appId: com.tuangatech.2nddesktop
productName: 2ndDesktop
copyright: 2ndDesktop
directories:
  output: release
  buildResources: build
files:
  - dist/renderer/**
  - electron/**
  - assets/tray/*.png
  - assets/app-icon.png
  - package.json
  - '!**/*.map'
# koffi 3 ships its native code in per-platform packages (@koromix/koffi-*). Native files cannot be
# loaded from inside the asar archive, so they are unpacked.
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**
mac:
  category: public.app-category.entertainment
  # Only English is shipped (the app has no other language); keeps the .app small.
  electronLanguages: en
  # The same drawing on the macOS icon grid (824 of 1024 px); build/icon.png is the Windows icon (npm run assets).
  icon: build/icon-mac.png
  target:
    - target: dmg
      arch: arm64
  # Desktop mode on macOS reads the window list through koffi for its cover check (electron/desktop-mac.js).
  # npm installs only the koffi package of the machine's own processor; `npm run dist` adds the other one first
  # (scripts/koffi-universal.mjs). The first Mac download is Apple silicon only (arch: arm64 above); these two lines
  # stay so that a universal build still works if x64 comes back (x64ArchFiles tells @electron/universal that the
  # files may be the same in both halves).
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/@koromix/**
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: true
  perMachine: false
